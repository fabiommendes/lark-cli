[project]
name = "lark-run"
version = "0.1.0"
description = "A simple command-line interface for Lark, the parsing Library."
readme = "README.md"
authors = [
    { name = "Fábio Macêdo Mendes", email = "fabiomacedomendes@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "lark-parser>=0.12.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.6",
]

[project.scripts]
lark-run = "lark_run:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["lark_rn.py"]

[tool.mypy]
strict = true

[dependency-groups]
dev = ["mypy>=2.1.0", "ruff>=0.15.15", "types-pyyaml>=6.0.12.20260518"]
